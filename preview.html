<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortfoliX | Preview</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <nav class="site-nav">
            <a class="logo" href="index.html">PortfoliX</a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="builder.html">Builder</a>
                <a href="preview.html">Preview</a>
            </div>
        </nav>
    </header>

    <main id="portfolioPreview" class="portfolio-page template-modern">

        <section class="portfolio-hero">
            <img
                id="portfolioImage"
                class="portfolio-profile"
                src="assets/images/prof.png"
                alt="Profile picture"
            >

            <p id="portfolioTitle" class="eyebrow">
                Software Engineer
            </p>

            <h1 id="portfolioName">
                John Vincent Telmosa
            </h1>

            <p id="portfolioAbout">
                I am an aspiring software engineer.
            </p>

            <a
                id="portfolioGithub"
                class="btn btn-primary"
                href="https://github.com/"
                target="_blank"
                rel="noopener"
            >
                GitHub
            </a>
        </section>

        <section class="portfolio-section">
            <h2>Skills</h2>

            <div id="portfolioSkills" class="skill-grid"></div>
        </section>

        <section class="portfolio-section">
            <h2>Technology Stack</h2>

            <div id="portfolioTechnologies" class="technology-list"></div>
        </section>

        <section class="portfolio-section">
            <div class="section-heading-row">
                <div>
                    <p class="eyebrow">SELECTED WORK</p>
                    <h2>Projects</h2>
                </div>
            </div>

            <div id="portfolioProjects" class="project-grid"></div>
        </section>

        <section class="portfolio-section contact-section">
            <h2>Contact</h2>

            <p id="portfolioEmail"></p>

            <a
                id="portfolioContactGithub"
                class="btn btn-primary"
                href="https://github.com/"
                target="_blank"
                rel="noopener"
            >
                Visit GitHub
            </a>
        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 PortfoliX</p>

        <div class="footer-actions">
            <a class="btn btn-secondary" href="builder.html">
                Edit Portfolio
            </a>

            <button class="btn btn-primary" id="downloadButton">
                Download HTML
            </button>
        </div>
    </footer>

    <script src="js/preview.js"></script>
</body>
</html>
