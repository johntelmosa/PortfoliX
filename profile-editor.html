<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Editor</title>
</head>
<body>
    <form>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your name" minlength="3" maxlength="30" required>

        <label for="title">Professional Title</label>
        <input type="text" id="title" name="title" placeholder="Enter your professional title" required maxlength="20">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>

        <label for="aboutme">About Me</label>
        <textarea id="aboutme" name="aboutme" placeholder="Write something about yourself" required minlength="20" maxlength="300"></textarea>

        <label for="profile">Profile Picture</label>
        <input type="file" name="profile" accept="image/*" id="profile">
        
        <label for="github">GitHub</label>
        <input type="url" id="github" name="github" placeholder="https://github.com/username" required>

        <button type="submit">Save Profile</button>
    </form>    

    
</body>
</html>
